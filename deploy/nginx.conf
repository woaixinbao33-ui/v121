# /etc/nginx/conf.d/v121.conf
# Replace v121.example.com with your actual domain.
# certbot --nginx will rewrite this file to add TLS lines after issuance.

server {
    listen 80;
    server_name v121.example.com;

    # Body-size cap; sequence payloads are tiny (<1 KB).
    client_max_body_size 16k;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'"
        always;

    # Lightweight rate limit for API key brute force resistance.
    # Define the zone in nginx.conf http{} block:
    #   limit_req_zone $binary_remote_addr zone=v121:10m rate=10r/s;
    location /v100/ {
        limit_req zone=v121 burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /ai/ {
        limit_req zone=v121 burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8000/healthz;
        access_log off;
    }

    location = /terminal {
        proxy_pass http://127.0.0.1:8000/terminal;
        proxy_set_header Host $host;
    }

    location = /console {
        proxy_pass http://127.0.0.1:8000/console;
        proxy_set_header Host $host;
    }

    # 管理后台：HTML 与 cookie 鉴权 API 都走这里。
    # set_cookie / cookie 头需要透传，httponly 由后端写入。
    location /admin {
        limit_req zone=v121 burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 透传 cookie
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_read_timeout 30s;
    }

    location = / {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
    }

    # Block everything else explicitly.
    location / {
        return 404;
    }
}
